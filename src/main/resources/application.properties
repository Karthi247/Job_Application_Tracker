spring.application.name=job-application-tracker


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_application_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.reminders.scan-interval-ms=${REMINDER_SCAN_INTERVAL_MS:60000}
